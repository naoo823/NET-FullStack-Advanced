# Name of the workflow
name: Continuous Deployment (CD)

# When this workflow should run
on:
  push:
    branches:
      - main  # Only run when code is pushed to the main branch

# Jobs to run
jobs:
  # --- DEPLOY FRONTEND JOB ---
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Deployment to Vercel is incredibly easy with their official GitHub Action
      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # The directory where your frontend code lives
          working-directory: ./client

  # --- DEPLOY BACKEND JOB ---
  # This job will run in parallel with the frontend deployment
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Deployment to Render is done via a "deploy hook"
      # This step simply sends a request to a special URL provided by Render
      - name: Deploy Backend to Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}