<!-- Entry point --><!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- This links to the little icon in the browser tab -->
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    
    <!-- This is crucial for responsive design on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta 
      name="description" 
      content="The official website for the NET Team, specializing in full-stack development, UI/UX, and digital solutions with Silence, Discipline, and Quality." 
    />
    <meta name="keywords" content="NET Team, full-stack, web development, mobile development, UI/UX, React, Node.js" />
    
    <!-- Google Fonts for our attractive UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- The title that appears in the browser tab -->
    <title>NET Team - Silence. Discipline. Quality.</title>
  </head>
  <body>
    <!-- 
      THE MAGIC HAPPENS HERE:
      This is the empty container where your entire React application will be rendered.
      Your main.jsx file targets this specific div.
    -->
    <div id="root"></div>

    <!-- 
      This script tag is what starts your React application.
      Vite handles bundling this for you.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
