server {
  listen 80;

  # The location of our static files
  root /usr/share/nginx/html;
  index index.html index.htm;

  location / {
    # This is the magic!
    # It will first try to serve the requested file ($uri),
    # then a directory with that name ($uri/),
    # and if neither exists, it will fall back to serving /index.html.
    # This allows React Router to handle all the page routing.
    try_files $uri $uri/ /index.html;
  }

  # Optional: You can add gzip compression for better performance
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;
}